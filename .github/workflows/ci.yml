name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: lint, unit, build, e2e (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the hygiene test reads every commit message
      - uses: actions/setup-node@v7
        with:
          # package.json "engines": the newest 22.x that satisfies it
          node-version: '>=22.22.2 <23'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the Playwright report when the e2e run fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: lint, unit, build (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.22.2 <23'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
